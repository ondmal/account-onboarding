<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 460" width="1100" height="460" role="img" aria-labelledby="title desc">
  <title id="title">Life of a background command</title>
  <desc id="desc">One background command end to end: the state change and the command row are committed in one database transaction to the outbox in PostgreSQL; right after commit the command is published to a Storage Queue with durable, at-least-once delivery; the Azure Functions worker executes the idempotent handler through the full Clean Architecture stack and calls the external system; the external system answers later on the message bus, and the reply is correlated and updates state. Safety nets: a timer-driven outbox publisher re-publishes what the first publish missed; a deferred reconcile command completes each pending operation once its reply has landed; a periodic sweep is the backstop. Expired or permanently failed commands are dead-lettered as data-loss events.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f8"/>
      <stop offset="1" stop-color="#e6eaf1"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f6bff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ours" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="1" stop-color="#eaefff"/>
    </linearGradient>
    <linearGradient id="oursStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <linearGradient id="num" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#5b74ff"/>
      <stop offset="1" stop-color="#9259ff"/>
    </linearGradient>
    <linearGradient id="ext" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfcfe"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <filter id="shadow" x="-10%" y="-25%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
    <marker id="aAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d84ff"/>
    </marker>
    <marker id="aSafe" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#16a34a"/>
    </marker>
    <marker id="aDead" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e5484d"/>
    </marker>
    <style>
      text { font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 2.2px; fill: #4f6bff; }
      .eyebrowS{ font-size: 10.5px; font-weight: 700; letter-spacing: 1.8px; fill: #7c8aa5; }
      .h1      { font-size: 21px; font-weight: 600; fill: #0f172a; }
      .lead    { font-size: 12.5px; fill: #64748b; }
      .ttl     { font-size: 14px; font-weight: 600; fill: #111827; }
      .sub     { font-size: 11.5px; fill: #64748b; }
      .subO    { font-size: 11.5px; fill: #4a58b8; }
      .pill    { font-size: 11px; fill: #475569; }
      .legend  { font-size: 11.5px; fill: #64748b; }
      .numT    { font-size: 11px; font-weight: 700; fill: #ffffff; }
      .whereT  { font-size: 10.5px; font-weight: 600; fill: #3546b3; }
      .whereET { font-size: 10.5px; font-weight: 600; fill: #475569; }
      .badgeT  { font-size: 10px; font-weight: 600; fill: #15803d; }
      .band    { fill: #ffffff; fill-opacity: 0.5; stroke: #dfe4ef; stroke-width: 1; }
      .cardO   { fill: url(#ours); stroke: url(#oursStroke); stroke-width: 1.5; filter: url(#shadow); }
      .cardE   { fill: url(#ext); stroke: #cfd6e3; stroke-width: 1.2; filter: url(#shadow); }
      .cardS   { fill: #ffffff; stroke: #4ade80; stroke-width: 1.4; stroke-dasharray: 6 4; filter: url(#shadow); }
      .cardD   { fill: #ffffff; stroke: #f59ea0; stroke-width: 1.4; stroke-dasharray: 6 4; filter: url(#shadow); }
      .where   { fill: #4f6bff; fill-opacity: 0.08; stroke: #4f6bff; stroke-opacity: 0.35; stroke-width: 1; }
      .whereE  { fill: #0f172a; fill-opacity: 0.04; stroke: #cfd6e3; stroke-width: 1; }
      .tileS   { fill: #16a34a; fill-opacity: 0.10; }
      .tileD   { fill: #e5484d; fill-opacity: 0.10; }
      .icS     { fill: none; stroke: #16a34a; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .icD     { fill: none; stroke: #e5484d; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .lnO     { fill: none; stroke: #6d84ff; stroke-width: 1.8; }
      .lnS     { fill: none; stroke: #22a55a; stroke-width: 1.6; stroke-dasharray: 5 4; }
      .lnD     { fill: none; stroke: #e5484d; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .pillBg  { fill: #ffffff; stroke: #d6dce8; stroke-width: 1; }
      .badge   { fill: #16a34a; fill-opacity: 0.10; stroke: #16a34a; stroke-opacity: 0.35; stroke-width: 1; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1100" height="460" rx="22" fill="url(#bg)"/>
  <rect width="1100" height="460" rx="22" fill="url(#dots)"/>
  <ellipse cx="550" cy="200" rx="480" ry="180" fill="url(#halo)"/>

  <!-- Header -->
  <text class="eyebrow" x="44" y="44">BACKGROUND COMMAND</text>
  <text class="h1" x="44" y="72">The life of one command: nothing lost, nothing stuck</text>
  <text class="lead" x="44" y="96">The same path for every side-effect and for the account-creation request.</text>
  <circle cx="702" cy="52" r="5" fill="url(#oursStroke)"/>
  <text class="legend" x="714" y="56">this system</text>
  <circle cx="800" cy="52" r="5" fill="#c3ccdb"/>
  <text class="legend" x="812" y="56">external</text>
  <circle cx="880" cy="52" r="5" fill="#22a55a"/>
  <text class="legend" x="892" y="56">safety nets</text>
  <circle cx="976" cy="52" r="5" fill="#e5484d"/>
  <text class="legend" x="988" y="56">dead-letter</text>

  <!-- Happy path -->
  <path class="lnO" d="M236 185 H254" marker-end="url(#aAccent)"/>
  <path class="lnO" d="M438 185 H456" marker-end="url(#aAccent)"/>
  <path class="lnO" d="M640 185 H658" marker-end="url(#aAccent)"/>
  <path class="lnO" d="M842 185 H860" marker-end="url(#aAccent)"/>

  <!-- 1 Commit -->
  <rect class="cardO" x="56" y="124" width="180" height="122" rx="12"/>
  <circle cx="80" cy="148" r="11" fill="url(#num)"/>
  <text class="numT" x="80" y="152" text-anchor="middle">1</text>
  <text class="ttl" x="100" y="153">Commit</text>
  <text class="subO" x="72" y="178">state change + command row</text>
  <text class="sub" x="72" y="195">one database transaction</text>
  <rect class="where" x="72" y="212" width="124" height="20" rx="10"/>
  <text class="whereT" x="134" y="226" text-anchor="middle">PostgreSQL · outbox</text>

  <!-- 2 Publish -->
  <rect class="cardO" x="258" y="124" width="180" height="122" rx="12"/>
  <circle cx="282" cy="148" r="11" fill="url(#num)"/>
  <text class="numT" x="282" y="152" text-anchor="middle">2</text>
  <text class="ttl" x="302" y="153">Publish</text>
  <text class="subO" x="274" y="178">right after the commit</text>
  <text class="sub" x="274" y="195">durable, at-least-once</text>
  <rect class="where" x="274" y="212" width="96" height="20" rx="10"/>
  <text class="whereT" x="322" y="226" text-anchor="middle">Storage Queue</text>

  <!-- 3 Execute -->
  <rect class="cardO" x="460" y="124" width="180" height="122" rx="12"/>
  <circle cx="484" cy="148" r="11" fill="url(#num)"/>
  <text class="numT" x="484" y="152" text-anchor="middle">3</text>
  <text class="ttl" x="504" y="153">Execute</text>
  <text class="subO" x="476" y="178">idempotent handler,</text>
  <text class="sub" x="476" y="195">full Clean Architecture stack</text>
  <rect class="where" x="476" y="212" width="108" height="20" rx="10"/>
  <text class="whereT" x="530" y="226" text-anchor="middle">Azure Functions</text>

  <!-- 4 External system -->
  <rect class="cardE" x="662" y="124" width="180" height="122" rx="12"/>
  <circle cx="686" cy="148" r="11" fill="#a7b2c6"/>
  <text class="numT" x="686" y="152" text-anchor="middle">4</text>
  <text class="ttl" x="706" y="153">External system</text>
  <text class="sub" x="678" y="178">accepts the request,</text>
  <text class="sub" x="678" y="195">answers later</text>
  <rect class="whereE" x="678" y="212" width="132" height="20" rx="10"/>
  <text class="whereET" x="744" y="226" text-anchor="middle">CRM, orchestration, …</text>

  <!-- 5 Reply -->
  <rect class="cardO" x="864" y="124" width="180" height="122" rx="12"/>
  <circle cx="888" cy="148" r="11" fill="url(#num)"/>
  <text class="numT" x="888" y="152" text-anchor="middle">5</text>
  <text class="ttl" x="908" y="153">Reply</text>
  <text class="subO" x="880" y="178">correlated to its process,</text>
  <text class="sub" x="880" y="195">state updated</text>
  <rect class="where" x="880" y="212" width="94" height="20" rx="10"/>
  <text class="whereT" x="927" y="226" text-anchor="middle">message bus</text>

  <!-- Safety-net and dead-letter connectors -->
  <path class="lnS" d="M300 340 V250" marker-end="url(#aSafe)"/>
  <path class="lnD" d="M410 246 V290 H500 V336" marker-end="url(#aDead)"/>
  <path class="lnD" d="M600 246 V336" marker-end="url(#aDead)"/>
  <rect class="pillBg" x="491" y="279" width="118" height="22" rx="11"/>
  <text class="pill" x="550" y="294" text-anchor="middle">expired or permanent</text>
  <path class="lnS" d="M760 340 V300 H950 V250" marker-end="url(#aSafe)"/>
  <path class="lnS" d="M1010 340 V250" marker-end="url(#aSafe)"/>

  <text class="eyebrowS" x="196" y="330">SAFETY NETS</text>

  <!-- Outbox publisher -->
  <rect class="cardS" x="196" y="340" width="220" height="84" rx="12"/>
  <rect class="tileS" x="210" y="354" width="30" height="30" rx="8"/>
  <g transform="translate(217 361)">
    <path class="icS" d="M14 8 A6 6 0 1 1 11.5 3.2 M14 1.5 V5 H10.5"/>
  </g>
  <text class="ttl" x="250" y="374">Outbox publisher</text>
  <rect class="badge" x="366" y="362" width="40" height="17" rx="8.5"/>
  <text class="badgeT" x="386" y="374" text-anchor="middle">timer</text>
  <text class="sub" x="210" y="400">re-publishes anything the</text>
  <text class="sub" x="210" y="415">first publish missed</text>

  <!-- Dead-letter -->
  <rect class="cardD" x="436" y="340" width="210" height="84" rx="12"/>
  <rect class="tileD" x="450" y="354" width="30" height="30" rx="8"/>
  <g transform="translate(457 361)">
    <circle class="icD" cx="8" cy="8" r="6.5"/>
    <path class="icD" d="M3.5 3.5 L12.5 12.5"/>
  </g>
  <text class="ttl" x="490" y="374">Dead-letter</text>
  <text class="sub" x="450" y="400">flagged as a data-loss event,</text>
  <text class="sub" x="450" y="415">never dropped silently</text>

  <!-- Sweep -->
  <rect class="cardS" x="666" y="340" width="184" height="84" rx="12"/>
  <rect class="tileS" x="680" y="354" width="30" height="30" rx="8"/>
  <g transform="translate(687 361)">
    <circle class="icS" cx="8" cy="8" r="6.5"/>
    <path class="icS" d="M8 4 V8 L10.8 9.8"/>
  </g>
  <text class="ttl" x="720" y="374">Sweep</text>
  <rect class="badge" x="772" y="362" width="40" height="17" rx="8.5"/>
  <text class="badgeT" x="792" y="374" text-anchor="middle">timer</text>
  <text class="sub" x="680" y="400">backstop after a quiet</text>
  <text class="sub" x="680" y="415">period; nothing stuck</text>

  <!-- Reconcile -->
  <rect class="cardS" x="864" y="340" width="180" height="84" rx="12"/>
  <rect class="tileS" x="878" y="354" width="30" height="30" rx="8"/>
  <g transform="translate(885 361)">
    <circle class="icS" cx="8" cy="8" r="6.5"/>
    <path class="icS" d="M5 8.2 L7.2 10.4 L11.2 6"/>
  </g>
  <text class="ttl" x="918" y="374">Reconcile</text>
  <text class="sub" x="878" y="400">deferred per operation;</text>
  <text class="sub" x="878" y="415">completes it on reply</text>
</svg>
