<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 530" width="1100" height="530" role="img" aria-labelledby="title desc">
  <title id="title">Onboarding journey</title>
  <desc id="desc">Phase 1, interactive steps: sign in, identify company, verify company; every step responds instantly and the customer can move back and forth, or reach a logical dead-end such as a company without a VAT number, in which case sales is notified. Side-effects go to the CRM and the customer engagement platform in the background and never block a step. Phase 2, account creation: submit starts account creation in the external process orchestration system; the UI polls the status while the account is being created and ends in an account created or a dead-end.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f2f4f8"/>
      <stop offset="1" stop-color="#e6eaf1"/>
    </linearGradient>
    <radialGradient id="halo" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#4f6bff" stop-opacity="0.10"/>
      <stop offset="1" stop-color="#4f6bff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ours" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#f5f7ff"/>
      <stop offset="1" stop-color="#eaefff"/>
    </linearGradient>
    <linearGradient id="oursStroke" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4f6bff"/>
      <stop offset="1" stop-color="#9b5cff"/>
    </linearGradient>
    <linearGradient id="ext" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="1" stop-color="#fbfcfe"/>
    </linearGradient>
    <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#0f172a" fill-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur stdDeviation="10"/>
    </filter>
    <filter id="shadow" x="-10%" y="-25%" width="120%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#1e293b" flood-opacity="0.08"/>
    </filter>
    <marker id="aAccent" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6d84ff"/>
    </marker>
    <marker id="aMuted" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#a7b2c6"/>
    </marker>
    <marker id="aEnd" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e5484d"/>
    </marker>
    <style>
      .lnEnd   { fill: none; stroke: #e5484d; stroke-width: 1.6; }
      text { font-family: "Inter", -apple-system, "Segoe UI", Helvetica, Arial, sans-serif; }
      .eyebrow { font-size: 11px; font-weight: 700; letter-spacing: 2.2px; fill: #4f6bff; }
      .phase   { font-size: 11px; font-weight: 700; letter-spacing: 1.6px; fill: #3546b3; }
      .h1      { font-size: 21px; font-weight: 600; fill: #0f172a; }
      .ttl     { font-size: 14px; font-weight: 600; fill: #111827; }
      .sub     { font-size: 11.5px; fill: #64748b; }
      .subO    { font-size: 11.5px; fill: #4a58b8; }
      .pill    { font-size: 11px; fill: #475569; }
      .legend  { font-size: 11.5px; fill: #64748b; }
      .okT     { font-size: 13px; font-weight: 600; fill: #15803d; }
      .endT    { font-size: 13px; font-weight: 600; fill: #b42318; }
      .panel   { fill: #ffffff; fill-opacity: 0.5; stroke: #dfe4ef; stroke-width: 1; }
      .cardO   { fill: url(#ours); stroke: url(#oursStroke); stroke-width: 1.5; filter: url(#shadow); }
      .cardE   { fill: url(#ext); stroke: #cfd6e3; stroke-width: 1.2; filter: url(#shadow); }
      .cardOk  { fill: #f0fdf4; stroke: #4ade80; stroke-width: 1.4; filter: url(#shadow); }
      .cardEnd { fill: #fef3f2; stroke: #f59ea0; stroke-width: 1.4; filter: url(#shadow); }
      .glowO   { fill: none; stroke: #6d8dff; stroke-width: 6; stroke-opacity: 0.20; }
      .tileE   { fill: #0f172a; fill-opacity: 0.05; }
      .icE     { fill: none; stroke: #64748b; stroke-width: 1.6; stroke-linecap: round; stroke-linejoin: round; }
      .icO     { fill: none; stroke: #4f6bff; stroke-width: 1.8; stroke-linecap: round; }
      .icOk    { fill: none; stroke: #16a34a; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; }
      .icEnd   { fill: none; stroke: #e5484d; stroke-width: 1.8; stroke-linecap: round; }
      .lnO     { fill: none; stroke: #6d84ff; stroke-width: 1.8; }
      .lnBack  { fill: none; stroke: #9aa9ff; stroke-width: 1.4; }
      .lnSide  { fill: none; stroke: #a7b2c6; stroke-width: 1.5; stroke-dasharray: 5 4; }
      .lnE     { fill: none; stroke: #a7b2c6; stroke-width: 1.5; }
      .pillBg  { fill: #ffffff; stroke: #d6dce8; stroke-width: 1; }
    </style>
  </defs>

  <!-- Canvas -->
  <rect width="1100" height="530" rx="22" fill="url(#bg)"/>
  <rect width="1100" height="530" rx="22" fill="url(#dots)"/>
  <ellipse cx="550" cy="260" rx="480" ry="200" fill="url(#halo)"/>

  <!-- Header -->
  <text class="eyebrow" x="44" y="44">SELF-SERVICE JOURNEY · EXAMPLE VARIANT</text>
  <text class="h1" x="44" y="72">Synchronous steps, then an observed outcome</text>
  <circle cx="790" cy="52" r="5" fill="url(#oursStroke)"/>
  <text class="legend" x="802" y="56">this system</text>
  <circle cx="888" cy="52" r="5" fill="#c3ccdb"/>
  <text class="legend" x="900" y="56">external</text>
  <path class="lnSide" d="M966 52 H990"/>
  <text class="legend" x="996" y="56">side-effect</text>

  <!-- Phase panels -->
  <rect class="panel" x="56" y="96" width="480" height="408" rx="16"/>
  <text class="phase" x="76" y="122">PHASE 1 · INTERACTIVE STEPS</text>
  <text class="sub" x="76" y="140">synchronous: every step answers at once, back and forth</text>

  <rect class="panel" x="556" y="96" width="492" height="408" rx="16"/>
  <text class="phase" x="576" y="122">PHASE 2 · ACCOUNT CREATION</text>
  <text class="sub" x="576" y="140">the UI switches to observing the status</text>

  <!-- ===== Phase 1 ===== -->
  <!-- back-navigation arcs -->
  <path class="lnBack" d="M262 196 C262 168 178 168 178 192" marker-end="url(#aAccent)"/>
  <path class="lnBack" d="M414 196 C414 168 330 168 330 192" marker-end="url(#aAccent)"/>

  <rect class="cardO" x="76" y="196" width="136" height="70" rx="12"/>
  <text class="ttl" x="92" y="225">Sign in</text>
  <text class="sub" x="92" y="246">instant response</text>

  <path class="lnO" d="M212 231 H224" marker-end="url(#aAccent)"/>

  <rect class="cardO" x="228" y="196" width="136" height="70" rx="12"/>
  <text class="ttl" x="244" y="225">Identify company</text>
  <text class="sub" x="244" y="246">instant response</text>

  <path class="lnO" d="M364 231 H376" marker-end="url(#aAccent)"/>

  <rect class="cardO" x="380" y="196" width="136" height="70" rx="12"/>
  <text class="ttl" x="396" y="225">Verify company</text>
  <text class="sub" x="396" y="246">instant response</text>

  <!-- logical dead-end -->
  <path class="lnEnd" d="M490 266 V288" marker-end="url(#aEnd)"/>
  <rect class="cardEnd" x="380" y="292" width="136" height="50" rx="11"/>
  <path class="icEnd" d="M394 306 L402 314 M402 306 L394 314"/>
  <text class="endT" x="410" y="315">Dead-end</text>
  <text class="sub" x="394" y="333">e.g. no VAT number</text>

  <!-- side-effects -->
  <path class="lnSide" d="M144 266 V376 M296 266 V376 M448 342 V376"/>
  <path class="lnSide" d="M144 376 H448"/>
  <path class="lnSide" d="M186 376 V416" marker-end="url(#aMuted)"/>
  <path class="lnSide" d="M406 376 V416" marker-end="url(#aMuted)"/>
  <rect class="pillBg" x="206" y="365" width="180" height="22" rx="11"/>
  <text class="pill" x="296" y="380" text-anchor="middle">in the background · never block</text>

  <rect class="cardE" x="76" y="420" width="210" height="64" rx="12"/>
  <rect class="tileE" x="90" y="436" width="32" height="32" rx="8"/>
  <g transform="translate(98 444)">
    <circle class="icE" cx="6" cy="5" r="2.6"/>
    <path class="icE" d="M1.5 14 C1.5 10.8 3.5 9.2 6 9.2 C8.5 9.2 10.5 10.8 10.5 14"/>
    <circle class="icE" cx="11.5" cy="4" r="2"/>
    <path class="icE" d="M12 8.3 C13.8 8.6 14.8 10 14.8 12.5"/>
  </g>
  <text class="ttl" x="134" y="447">CRM</text>
  <text class="sub" x="134" y="466">lead · sales notified</text>

  <rect class="cardE" x="306" y="420" width="210" height="64" rx="12"/>
  <rect class="tileE" x="320" y="436" width="32" height="32" rx="8"/>
  <g transform="translate(328 444)">
    <path class="icE" d="M2 3 H14 V11 H7 L4 14 V11 H2 Z"/>
  </g>
  <text class="ttl" x="364" y="447">Engagement</text>
  <text class="sub" x="364" y="466">funnel events</text>

  <!-- phase transition -->
  <path class="lnO" d="M516 231 H572" marker-end="url(#aAccent)"/>

  <!-- ===== Phase 2 ===== -->
  <rect class="cardO" x="576" y="196" width="116" height="70" rx="12"/>
  <text class="ttl" x="592" y="225">Submit</text>
  <text class="sub" x="592" y="246">last step</text>

  <rect class="glowO" x="722" y="196" width="164" height="70" rx="12" filter="url(#glow)"/>
  <rect class="cardO" x="722" y="196" width="164" height="70" rx="12"/>
  <text class="ttl" x="738" y="222">Creating account</text>
  <path class="icO" d="M862 206 A8 8 0 1 1 854 214" transform="translate(4 2)"/>
  <text class="subO" x="738" y="242">UI polls the status:</text>
  <text class="sub" x="738" y="257">“not ready yet”</text>

  <path class="lnO" d="M692 231 H718" marker-end="url(#aAccent)"/>

  <!-- outcomes -->
  <path class="lnO" d="M886 231 H900 V205 H912" marker-end="url(#aAccent)"/>
  <path class="lnO" d="M900 231 V259 H912" marker-end="url(#aAccent)"/>

  <rect class="cardOk" x="916" y="184" width="116" height="42" rx="11"/>
  <path class="icOk" d="M930 205 L935 210 L944 200"/>
  <text class="okT" x="952" y="210">Created</text>

  <rect class="cardEnd" x="916" y="238" width="116" height="42" rx="11"/>
  <path class="icEnd" d="M931 252 L941 262 M941 252 L931 262"/>
  <text class="endT" x="952" y="264">Dead-end</text>

  <!-- orchestration -->
  <path class="lnE" d="M634 266 V452 H718" marker-end="url(#aMuted)"/>
  <rect class="pillBg" x="607" y="348" width="54" height="22" rx="11"/>
  <text class="pill" x="634" y="363" text-anchor="middle">starts</text>

  <path class="lnE" d="M804 420 V270" marker-end="url(#aMuted)"/>
  <rect class="pillBg" x="777" y="334" width="54" height="22" rx="11"/>
  <text class="pill" x="804" y="349" text-anchor="middle">status</text>

  <rect class="cardE" x="722" y="420" width="210" height="64" rx="12"/>
  <rect class="tileE" x="736" y="436" width="32" height="32" rx="8"/>
  <g transform="translate(744 444)">
    <circle class="icE" cx="3" cy="8" r="2"/>
    <circle class="icE" cx="13" cy="3" r="2"/>
    <circle class="icE" cx="13" cy="13" r="2"/>
    <path class="icE" d="M5 7 L11 4 M5 9 L11 12"/>
  </g>
  <text class="ttl" x="780" y="447">Process orchestration</text>
  <text class="sub" x="780" y="466">creates &amp; provisions</text>
</svg>
